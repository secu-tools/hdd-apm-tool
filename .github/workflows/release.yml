name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - release
        default: "beta"
      version:
        description: "Base version (e.g. 1.0.3) -- leave empty to use version/version_base.txt"
        required: false
        type: string
      build_number:
        description: "Build number -- leave empty for auto-increment (current + 1)"
        required: false
        type: string
      release_description:
        description: "Release description (optional -- can be edited on GitHub after publishing)"
        required: false
        type: string

permissions:
  contents: write

env:
  # Set to "false" to delete intermediate build artifacts after the release is
  # published successfully. Does not affect files on the GitHub release page.
  # Set to "true" to keep artifacts on the runner after release.
  KEEP_ARTIFACTS: "false"

# Prevent concurrent release runs to avoid version file race conditions.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1. Run tests on Linux, macOS, and Windows -- abort on any failure.
  #    BUILD_NUMBER is pinned to the current file value so the
  #    test run does not auto-increment the build counter.
  # ---------------------------------------------------------------
  ci-tests:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x build.sh
          BUILD_NUMBER=$(cat version/build_number.txt | tr -cd '0-9')
          export BUILD_NUMBER
          ./build.sh -test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BUILD_NUMBER = (Get-Content version/build_number.txt -Raw).Trim() -replace '[^0-9]', ''
          .\build.ps1 -test

  # ---------------------------------------------------------------
  # 2. Resolve version and build number from version/ files,
  #    applying any user overrides. Outputs feed all downstream jobs.
  # ---------------------------------------------------------------
  resolve-version:
    needs: ci-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      full_version: ${{ steps.resolve.outputs.full_version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      version_changed: ${{ steps.resolve.outputs.version_changed }}
      next_build_number: ${{ steps.resolve.outputs.next_build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and build number
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE_VERSION="1.0.0"
          if [ -f version/version_base.txt ]; then
            FILE_VERSION=$(head -1 version/version_base.txt | tr -cd '0-9.')
          fi
          FILE_BUILD=0
          if [ -f version/build_number.txt ]; then
            FILE_BUILD=$(head -1 version/build_number.txt | tr -cd '0-9')
          fi
          [ -z "$FILE_BUILD" ] && FILE_BUILD=0

          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION_CHANGED="true"
          else
            VERSION="$FILE_VERSION"
            VERSION_CHANGED="false"
          fi

          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            BUILD_NUMBER=$FILE_BUILD
          fi
          NEXT_BUILD_NUMBER=$((BUILD_NUMBER + 1))

          FULL_VERSION="${VERSION}.${BUILD_NUMBER}"

          # Release tags:  v1.0.4         (pure semver, picked up by go install @latest)
          # Beta tags:     v1.0.4-beta.N  (semver pre-release, excluded from @latest)
          # Binary filenames embed the full four-part version (1.0.4.N).
          if [ "${{ inputs.release_type }}" = "beta" ]; then
            TAG_NAME="v${VERSION}-beta.${BUILD_NUMBER}"
            IS_PRERELEASE="true"
          else
            TAG_NAME="v${VERSION}"
            IS_PRERELEASE="false"
          fi

          echo "version=$VERSION"                 >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER"       >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION"       >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME"               >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE"     >> "$GITHUB_OUTPUT"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "next_build_number=$NEXT_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          echo "Resolved: $FULL_VERSION (tag: $TAG_NAME, prerelease: $IS_PRERELEASE)"

          # Update the workflow run name so it shows the resolved version.
          if [ -n "$GITHUB_RUN_ID" ]; then
            RUN_NAME="${GITHUB_WORKFLOW} - ${FULL_VERSION}"
            echo "Setting workflow run name to '${RUN_NAME}'"
            curl -s -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              -d "$(printf '{"name":"%s"}' "$RUN_NAME")" || true
          fi

  # ---------------------------------------------------------------
  # 3a. Build Linux binaries + deb/rpm packages (linux/amd64 + linux/arm64)
  #     Pure Go (CGO_ENABLED=0) -- no native toolchain dependencies.
  #     nfpm is installed via go install for deb/rpm packaging.
  # ---------------------------------------------------------------
  build-linux:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build environment info
        run: |
          echo "Runner OS  : $(uname -s)"
          echo "Runner arch: $(uname -m)"
          echo "Go version : $(go version)"

      - name: Install nfpm (for deb/rpm packaging)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "nfpm version: $(nfpm --version)"

      - name: Build linux binaries + deb/rpm packages
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          BUILD_NUMBER: ${{ needs.resolve-version.outputs.build_number }}
        run: |
          echo "Building VERSION=${VERSION} BUILD_NUMBER=${BUILD_NUMBER}"
          chmod +x build.sh
          ./build.sh -linux -deb -rpm

      - name: List build outputs
        run: |
          echo "=== build/ ==="
          find build -type f | sort | while read f; do
            echo "  $f  ($(stat -c%s "$f") bytes)"
          done

      - name: Verify linux binaries and packages
        run: |
          fail=0
          for arch in amd64 arm64; do
            found=$(find build/linux -name "*-linux-${arch}" -type f 2>/dev/null)
            if [ -z "$found" ]; then
              echo "::error::FAIL: binary not found for linux/${arch}"
              fail=1
            else
              echo "OK binary: $found ($(stat -c%s "$found") bytes)"
            fi
            for ext in deb rpm; do
              pkg=$(find build/linux -name "*-linux-${arch}.${ext}" -type f 2>/dev/null)
              if [ -z "$pkg" ]; then
                echo "::error::FAIL: ${ext} package not found for linux/${arch}"
                fail=1
              else
                echo "OK package: $pkg ($(stat -c%s "$pkg") bytes)"
              fi
            done
          done
          if [ $fail -ne 0 ]; then
            echo "::error::Linux build or packaging failed -- aborting release"
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/linux/
          retention-days: 1

  # ---------------------------------------------------------------
  # 3b. Build macOS binaries (darwin/amd64 + darwin/arm64)
  #     Pure Go (CGO_ENABLED=0) -- no Xcode or native SDK required.
  # ---------------------------------------------------------------
  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build environment info
        run: |
          echo "Runner OS  : $(uname -s)"
          echo "Runner arch: $(uname -m)"
          echo "Go version : $(go version)"

      - name: Build darwin binaries (amd64 + arm64)
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          BUILD_NUMBER: ${{ needs.resolve-version.outputs.build_number }}
        run: |
          echo "Building VERSION=${VERSION} BUILD_NUMBER=${BUILD_NUMBER}"
          chmod +x build.sh
          ./build.sh -darwin

      - name: List build outputs
        run: |
          echo "=== build/ ==="
          find build -type f | sort | while read f; do
            echo "  $f  ($(du -k "$f" | cut -f1) KB)"
          done

      - name: Verify darwin binaries
        run: |
          fail=0
          for arch in amd64 arm64; do
            found=$(find build/darwin -name "*-darwin-${arch}" -type f 2>/dev/null)
            if [ -z "$found" ]; then
              echo "::error::FAIL: binary not found for darwin/${arch}"
              fail=1
            else
              echo "OK: $found ($(du -k "$found" | cut -f1) KB)"
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "::error::macOS build failed -- aborting release"
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build/darwin/
          retention-days: 1

  # ---------------------------------------------------------------
  # 3c. Build Windows binaries (windows/amd64 + windows/arm64)
  #     Pure Go (CGO_ENABLED=0) -- no native toolchain dependencies.
  # ---------------------------------------------------------------
  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build environment info
        shell: pwsh
        run: |
          Write-Host "Runner OS  : $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host "Runner arch: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Write-Host "Go version : $(go version)"

      - name: Build windows binaries (amd64 + arm64)
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          BUILD_NUMBER: ${{ needs.resolve-version.outputs.build_number }}
        run: |
          Write-Host "Building VERSION=$env:VERSION BUILD_NUMBER=$env:BUILD_NUMBER"
          .\build.ps1 -windows

      - name: List build outputs
        shell: pwsh
        run: |
          Write-Host "=== build\ ==="
          Get-ChildItem "build" -Recurse -File | Sort-Object FullName | ForEach-Object {
            Write-Host "  $($_.FullName)  ($($_.Length) bytes)"
          }

      - name: Verify windows binaries
        shell: pwsh
        run: |
          $fail = $false
          foreach ($arch in @("amd64", "arm64")) {
            $found = Get-ChildItem "build\windows" -Filter "*-windows-${arch}.exe" -ErrorAction SilentlyContinue
            if (-not $found) {
              Write-Host "::error::FAIL: binary not found for windows/${arch}" -ForegroundColor Red
              $fail = $true
            } else {
              Write-Host "OK: $($found.FullName) ($($found.Length) bytes)"
            }
          }
          if ($fail) {
            Write-Host "::error::Windows build failed -- aborting release"
            exit 1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build\windows\
          retention-days: 1

  # ---------------------------------------------------------------
  # 4. Publish release
  #    All three build jobs must succeed before this runs.
  #    Steps:
  #      - Collect and verify all 10 release files
  #        (2 linux bins, 2 linux debs, 2 linux rpms, 2 darwin bins, 2 windows exes)
  #      - Update version/ files and push commit
  #      - Compute SHA256 checksums
  #      - Create GitHub Release with all files attached
  # ---------------------------------------------------------------
  publish:
    needs: [resolve-version, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts/ -type f | while read f; do
            cp "$f" release/
          done
          echo "=== Collected release files ==="
          ls -lh release/ | sort
          echo "Total: $(find release -type f | wc -l | tr -d ' ') file(s)"

      - name: Verify all 10 release files are present
        run: |
          echo "=== Verifying release artifacts ==="
          ls release/ | sort
          echo ""
          count=$(find release -type f | wc -l | tr -d ' ')
          echo "Total files found: $count"
          if [ "$count" -lt 10 ]; then
            echo "::error::Expected 10 release files (2 linux bins, 2 debs, 2 rpms, 2 darwin bins, 2 windows exes), found $count -- aborting release"
            exit 1
          fi
          fail=0
          for arch in amd64 arm64; do
            found=$(find release -name "*-linux-${arch}" -type f 2>/dev/null)
            if [ -z "$found" ]; then
              echo "::error::FAIL: missing linux binary for linux/${arch}"
              fail=1
            else
              echo "OK: $found ($(stat -c%s "$found") bytes)"
            fi
            for ext in deb rpm; do
              pkg=$(find release -name "*-linux-${arch}.${ext}" -type f 2>/dev/null)
              if [ -z "$pkg" ]; then
                echo "::error::FAIL: missing ${ext} package for linux/${arch}"
                fail=1
              else
                echo "OK: $pkg ($(stat -c%s "$pkg") bytes)"
              fi
            done
            found=$(find release -name "*-darwin-${arch}" -type f 2>/dev/null)
            if [ -z "$found" ]; then
              echo "::error::FAIL: missing darwin binary for darwin/${arch}"
              fail=1
            else
              echo "OK: $found ($(stat -c%s "$found") bytes)"
            fi
            found=$(find release -name "*-windows-${arch}.exe" -type f 2>/dev/null)
            if [ -z "$found" ]; then
              echo "::error::FAIL: missing binary for windows/${arch}"
              fail=1
            else
              echo "OK: $found ($(stat -c%s "$found") bytes)"
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "::error::Required release files are missing -- aborting release"
            exit 1
          fi
          echo ""
          echo "All release files verified."

      - name: Update version files
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          BUILD_NUMBER="${{ needs.resolve-version.outputs.build_number }}"
          NEXT_BUILD_NUMBER="${{ needs.resolve-version.outputs.next_build_number }}"
          VERSION_CHANGED="${{ needs.resolve-version.outputs.version_changed }}"

          if [ "$VERSION_CHANGED" = "true" ]; then
            printf '%s\n' "$VERSION" > version/version_base.txt
            echo "Updated version_base.txt to $VERSION"
          fi

          printf '%s\n' "$NEXT_BUILD_NUMBER" > version/build_number.txt
          echo "Updated build_number.txt: $BUILD_NUMBER -> $NEXT_BUILD_NUMBER"

      - name: Commit and push version files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version/version_base.txt version/build_number.txt
          if git diff --cached --quiet; then
            echo "No version file changes to commit."
          else
            TAG_NAME="${{ needs.resolve-version.outputs.tag_name }}"
            git commit -m "release: update version files for ${TAG_NAME}"
            git push
          fi

      - name: Compute SHA256 checksums
        run: |
          cd release
          echo "## SHA256 Checksums" > /tmp/checksums.md
          echo "" >> /tmp/checksums.md
          echo '```' >> /tmp/checksums.md
          for f in $(ls -1 | sort); do
            sha256sum "$f" >> /tmp/checksums.md
          done
          echo '```' >> /tmp/checksums.md
          cat /tmp/checksums.md

      - name: Build release body
        env:
          RELEASE_DESC: ${{ inputs.release_description }}
        run: |
          FULL_VERSION="${{ needs.resolve-version.outputs.full_version }}"
          TAG_NAME="${{ needs.resolve-version.outputs.tag_name }}"
          TYPE="${{ inputs.release_type }}"

          {
            if [ "$TYPE" = "beta" ]; then
              echo "## HDD APM Tool ${TAG_NAME} (Pre-release)"
              echo ""
              echo "> **This is a pre-release build.** It may contain bugs or incomplete features."
            else
              echo "## HDD APM Tool ${TAG_NAME}"
            fi
            echo ""
            if [ -n "$RELEASE_DESC" ]; then
              echo "$RELEASE_DESC"
              echo ""
            fi
            echo ""
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG_NAME}"
            echo ""
            echo "---"
            echo ""
            cat /tmp/checksums.md
          } > /tmp/release_body.md
          cat /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_name }}
          name: "HDD APM Tool ${{ needs.resolve-version.outputs.tag_name }}"
          body_path: /tmp/release_body.md
          prerelease: ${{ needs.resolve-version.outputs.is_prerelease == 'true' }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # Cleanup: delete intermediate build artifacts from the runner
  # after the release has been published successfully.
  # Does not affect files uploaded to the GitHub release page.
  # Set KEEP_ARTIFACTS: "true" to retain artifacts after release.
  # ---------------------------------------------------------------
  cleanup:
    needs: [publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete intermediate build artifacts
        if: env.KEEP_ARTIFACTS == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact_ids=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --paginate \
            --jq '.artifacts[] | select(.name | startswith("build-")) | .id')
          if [ -z "$artifact_ids" ]; then
            echo "No matching artifacts to delete."
            exit 0
          fi
          for id in $artifact_ids; do
            echo "Deleting artifact id=$id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
          echo "Done."
