name: Build
run-name: ${{ github.workflow }} - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Set to "true" to keep build artifacts after each run.
  KEEP_ARTIFACTS: "false"

jobs:
  # ---------------------------------------------------------------
  # Build script verification -- Linux (ubuntu-latest)
  # Tests: all-platforms amd64+arm64, deb+rpm packaging,
  #        build script -test flag.
  # All builds are pure Go (CGO_ENABLED=0).
  # ---------------------------------------------------------------
  build-scripts-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "nfpm version: $(nfpm --version)"

      - name: Build all platforms amd64+arm64
        run: chmod +x build.sh && ./build.sh -all

      - name: Build linux + create deb and rpm packages
        run: ./build.sh -linux -deb -rpm

      - name: Run tests via build script (-test flag)
        run: |
          BUILD_NUMBER=$(cat version/build_number.txt | tr -cd '0-9')
          export BUILD_NUMBER
          ./build.sh -test

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/

  # ---------------------------------------------------------------
  # Build script verification -- Windows (windows-latest)
  # Tests: all-platforms amd64+arm64, deb+rpm packaging (cross-
  #        compiled linux binaries), build script -test flag.
  # All builds are pure Go (CGO_ENABLED=0).
  # ---------------------------------------------------------------
  build-scripts-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build all platforms amd64+arm64
        run: .\build.ps1 -all

      - name: Build linux + create deb and rpm packages
        run: .\build.ps1 -linux -deb -rpm

      - name: Run tests via build script (-test flag)
        shell: pwsh
        run: |
          $env:BUILD_NUMBER = (Get-Content version/build_number.txt -Raw).Trim() -replace '[^0-9]', ''
          .\build.ps1 -test

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build\

  # ---------------------------------------------------------------
  # Build script verification -- macOS (macos-latest)
  # Tests: darwin amd64+arm64 native build, build script -test flag.
  # All builds are pure Go (CGO_ENABLED=0).
  # ---------------------------------------------------------------
  build-scripts-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "nfpm version: $(nfpm --version)"

      - name: Build all platforms amd64+arm64
        run: chmod +x build.sh && ./build.sh -all

      - name: Build darwin binaries only
        run: ./build.sh -darwin

      - name: Run tests via build script (-test flag)
        run: |
          BUILD_NUMBER=$(cat version/build_number.txt | tr -cd '0-9')
          export BUILD_NUMBER
          ./build.sh -test

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build/
